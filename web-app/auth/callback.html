<!DOCTYPE html>
<html>
<head>
    <title>Google Sign-In - Redirecting...</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #000; color: #fff; }
        .container { text-align: center; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #4285f4; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Signing in with Google...</h2>
        <p>Please wait while we redirect you back to the app.</p>
    </div>
    <script>
        // This page handles the OAuth callback
        // The access token is in the URL fragment
        // The mobile app will capture this URL and extract the token
        
        // For web users, redirect to main page
        if (window.location.hash) {
            // Token is in the hash, let the app handle it
            setTimeout(function() {
                window.close();
            }, 2000);
        }
    </script>
</body>
</html>
